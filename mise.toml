[tools]
node = "26.12.0"

# mise install turns on the repo's git hooks: the pre-commit hook runs mise run check.
[hooks]
postinstall = "git config core.hooksPath .githooks"

[tasks.install]
description = "Install the npm dependencies"
run = "npm install"

[tasks.dev]
description = "Run the Vite dev server"
run = "npm run dev"

[tasks.build]
description = "Build the PWA into dist/"
run = "npm run build"

[tasks.gen-icons]
description = "Regenerate the PWA icons in public/icons (needs a python3 on PATH)"
run = "python3 scripts/gen-icons.py"

[tasks.gen-kanji]
description = "Regenerate the committed N5 kanji catalog in src/domain (needs network + a python3 on PATH)"
run = "python3 scripts/gen-kanji.py"

[tasks.clean]
description = "Remove build output"
run = "rm -rf dist dev-dist"

[tasks.lint]
description = "Run ESLint, including the hexagonal import boundary"
run = "npm run lint"

[tasks.typecheck]
description = "Run tsc and svelte-check"
run = "npm run typecheck"

[tasks.test]
description = "Run the Vitest suite"
run = "npm run test"

[tasks.check]
description = "Run every check CI runs but build: lint, typecheck and test"
run = ["npm run lint", "npm run typecheck", "npm run test"]
